{# Строка группы фильтра: галочка, название, число товаров. checked и count ставит view (mark_checked, facet_counts) #}
<label class="filter-option">
    <input type="checkbox" name="{{ name }}" value="{{ value }}"{% if checked %} checked{% endif %} />
    <span class="filter-option__name">{{ label }}</span>
    {% include "catalog/_facet_count.html" %}
</label>
