{% load i18n %}
{# «Сбросить» в ряду над товарами. Обёртка есть всегда, даже пустая: в неё HTMX кладёт новую кнопку после смены фильтра (oob) #}
<span class="reset-slot" id="reset"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% if reset_count %}
        <a class="chip chip--reset" href="{{ reset_url }}">
            {% include "icons/close.svg" %}
            {% trans "Сбросить" %}
            <span class="chip__count">{{ reset_count }}</span>
        </a>
    {% endif %}
</span>
